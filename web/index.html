<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gesipan · whiteboard infinito</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link rel="stylesheet" href="style.11.css" />
</head>
<body>

  <!-- ============ SIDEBAR ============ -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <h1>Gesipan</h1>
      <button id="new-board-btn" class="icon-btn" title="Nuevo board">＋</button>
    </div>
    <nav id="tabs">
      <button id="tab-boards" class="tab active">Boards</button>
      <button id="tab-bookmarks" class="tab">Bookmarks</button>
    </nav>
    <div id="board-list" class="board-list"></div>
    <div id="bm-collections" class="board-list hidden">
      <button id="bm-fav-btn" class="collections-add" title="Ver solo favoritos">★ Favoritas</button>
      <button id="new-collection-btn" class="collections-add">＋ Nueva colección</button>
    </div>
    <div class="sidebar-footer">
      <button id="export-btn" class="ghost-btn" title="Exportar este board a Markdown">⬇ .md</button>
      <span id="llm-dot" class="llm-dot" title="Inferencia">●</span>
    </div>
  </aside>

  <!-- ============ WHITEBOARD ============ -->
  <main id="board">
    <svg id="connections-layer"></svg>
    <div id="world"></div>

    <!-- Barra superior: búsqueda + acciones -->
    <div id="topbar">
      <div id="search-box" class="search-box">
        <span class="search-icon">⌕</span>
        <input id="note-search" type="text" placeholder="Buscar notas…" />
        <button id="search-clear" class="search-clear hidden">✕</button>
      </div>
      <button id="dark-toggle" class="icon-btn" title="Modo oscuro">🌙</button>
      <button id="trash-btn" class="icon-btn" title="Papelera">🗑️</button>
    </div>

    <!-- Barra inferior: solo el botón "más" + zoom -->
    <div id="toolbar">
      <button id="new-note-btn" class="tool-btn new-note" title="Crear (nota, grupo, flecha…)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <span class="tool-sep"></span>
      <button id="zoom-out" class="tool-btn">－</button>
      <span id="zoom-label">100%</span>
      <button id="zoom-in" class="tool-btn">＋</button>
      <button id="reset-view" class="tool-btn" title="Centrar">⌂</button>
    </div>

    <!-- Menú de tipos que abre el botón ＋ -->
    <div id="create-menu" class="create-menu hidden">
      <button data-type="postit" class="create-item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 4h16v16H4z" fill="currentColor" fill-opacity=".12"/><path d="M4 4h16v16H4z"/></svg>Nota post-it</button>
      <button data-type="pin" class="create-item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 4h6M10 4v6l-3 4h10l-3-4V4M8.5 18h7" stroke-linecap="round"/></svg>Nota chincheta</button>
      <button data-type="private" class="create-item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>Nota privada</button>
      <button data-type="group" class="create-item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>Grupo</button>
    </div>

    <div id="color-picker" class="color-picker hidden">
      <div class="swatch yellow active" data-color="yellow"></div>
      <div class="swatch pink" data-color="pink"></div>
      <div class="swatch green" data-color="green"></div>
      <div class="swatch blue" data-color="blue"></div>
      <div class="swatch purple" data-color="purple"></div>
      <div class="swatch white" data-color="white"></div>
    </div>

    <div id="connect-hint" class="connect-hint hidden">Arrastra de un ancla a otro ancla para unir · Esc cancela</div>
    <div id="tool-hint" class="tool-hint hidden">Clic en el lienzo para crear · Esc cancela</div>

    <!-- Menú contextual del grupo (popup junto al grupo) -->
    <div id="group-menu" class="hidden">
      <div class="insp-head">
        <div class="insp-title">Grupo</div>
        <button id="group-menu-close" class="icon-btn small" aria-label="Cerrar"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="insp-row">
        <label for="group-menu-title">Título</label>
        <input id="group-menu-title" type="text" placeholder="Nombre del grupo" />
      </div>
      <div class="insp-row">
        <label>Color</label>
        <div class="insp-colors group-colors">
          <div class="swatch lavender active" data-color="lavender"></div>
          <div class="swatch sage" data-color="sage"></div>
          <div class="swatch blush" data-color="blush"></div>
          <div class="swatch sky" data-color="sky"></div>
          <div class="swatch sand" data-color="sand"></div>
        </div>
      </div>
    </div>

    <!-- Inspector contextual (popup junto a la nota seleccionada) -->
    <div id="inspector" class="hidden">
      <div class="insp-head">
        <div class="insp-title">Nota</div>
        <button id="insp-close" class="icon-btn small" aria-label="Cerrar"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="insp-row insp-tags-row">
        <label for="insp-tags">Etiquetas</label>
        <input id="insp-tags" type="text" placeholder="ideas, urgente…" />
      </div>
      <div class="insp-row">
        <label>Estilo</label>
        <div class="insp-styles">
          <button id="insp-style-postit" class="style-btn active" title="Post-it"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 4h16v16H4z" fill="currentColor" fill-opacity=".15"/><path d="M4 4h16v16H4z"/></svg></button>
          <button id="insp-style-pin" class="style-btn" title="Chincheta"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 4h6M10 4v6l-3 4h10l-3-4V4M8.5 18h7" stroke-linecap="round"/></svg></button>
        </div>
      </div>
      <div class="insp-row">
        <label>Color</label>
        <div class="insp-colors">
          <div class="swatch yellow active" data-color="yellow"></div>
          <div class="swatch pink" data-color="pink"></div>
          <div class="swatch green" data-color="green"></div>
          <div class="swatch blue" data-color="blue"></div>
          <div class="swatch purple" data-color="purple"></div>
          <div class="swatch white" data-color="white"></div>
        </div>
      </div>
      <div class="insp-actions">
        <button id="insp-connect" class="act-btn" title="Unir a otra nota"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg><span>Unir</span></button>
        <button id="insp-group" class="act-btn" title="Grupo"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/></svg><span>Grupo</span></button>
        <button id="insp-private" class="act-btn" title="Privada"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg><span>Privada</span></button>
        <button id="insp-delete" class="act-btn danger" title="Eliminar"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg><span>Borrar</span></button>
      </div>
    </div>
  </main>

  <!-- ============ BOOKMARKS VIEW ============ -->
  <main id="bookmarks-view" class="hidden">
    <div class="bm-topbar">
      <h2 id="bm-collection-title">Todos los bookmarks</h2>
      <div class="bm-search">
        <input id="bm-search-input" type="text" placeholder="Buscar…" />
      </div>
      <button id="bm-sort-btn" class="ghost-btn" title="Ordenar">⇅</button>
      <button id="bm-export-btn" class="ghost-btn" title="Exportar a Markdown">⬇</button>
      <button id="bm-add-btn" class="primary-btn">＋</button>
    </div>
    <div id="bm-list" class="bm-list"></div>
    <div id="bm-empty" class="bm-empty hidden">No hay bookmarks. Añade uno con ＋.</div>
  </main>

  <!-- Diálogo para pedir confirmación/nombre -->
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <input id="modal-input" type="text" placeholder="Nombre del board" />
      <div class="modal-actions">
        <button id="modal-cancel" class="ghost-btn">Cancelar</button>
        <button id="modal-ok" class="primary-btn">Aceptar</button>
      </div>
    </div>
  </div>

  <!-- Diálogo para añadir bookmark -->
  <div id="bm-modal" class="modal hidden">
    <div class="modal-card wide">
      <h3>Añadir link</h3>
      <label>URL</label>
      <input id="bm-url" type="url" placeholder="https://…" />
      <div class="bm-fetch-row">
        <button id="bm-fetch-btn" class="ghost-btn">✨ Descubrir</button>
        <span id="bm-fetch-status" class="bm-fetch-status"></span>
      </div>
      <label>Título</label>
      <input id="bm-title" type="text" placeholder="Título (auto)" />
      <label>Etiquetas</label>
      <input id="bm-tags" type="text" placeholder="tech, kpop, dev" />
      <label>Colección</label>
      <select id="bm-collection"></select>
      <div class="modal-actions">
        <button id="bm-cancel" class="ghost-btn">Cancelar</button>
        <button id="bm-save" class="primary-btn">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Papelera -->
  <div id="trash-modal" class="modal hidden">
    <div class="modal-card trash-card">
      <div class="inspector-head">
        <h3>🗑️ Papelera</h3>
        <button id="trash-close" class="icon-btn small">✕</button>
      </div>
      <div id="trash-notes" class="trash-section"></div>
      <div id="trash-bookmarks" class="trash-section"></div>
      <div id="trash-empty" class="bm-empty hidden">La papelera está vacía.</div>
    </div>
  </div>

  <script src="app.12.js"></script>
</body>
</html>
