<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gesipan · whiteboard infinito</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link rel="stylesheet" href="style.4.css" />
</head>
<body>

  <!-- ============ SIDEBAR ============ -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <h1>Gesipan</h1>
      <button id="new-board-btn" class="icon-btn" title="Nueva pizarra">＋</button>
    </div>
    <nav id="tabs">
      <button id="tab-boards" class="tab active">Pizarras</button>
      <button id="tab-bookmarks" class="tab">Bookmarks</button>
    </nav>
    <div id="board-list" class="board-list"></div>
    <div id="bm-collections" class="board-list hidden">
      <button id="new-collection-btn" class="collections-add">＋ Nueva colección</button>
    </div>
    <div class="sidebar-footer">
      <button id="export-btn" class="ghost-btn" title="Exportar esta pizarra a Markdown">⬇ .md</button>
      <span id="llm-dot" class="llm-dot" title="Inferencia">●</span>
    </div>
  </aside>

  <!-- ============ WHITEBOARD ============ -->
  <main id="board">
    <svg id="connections-layer"></svg>
    <div id="world"></div>

    <!-- Barra superior: búsqueda + acciones -->
    <div id="topbar">
      <div id="search-box" class="search-box">
        <span class="search-icon">⌕</span>
        <input id="note-search" type="text" placeholder="Buscar notas…" />
        <button id="search-clear" class="search-clear hidden">✕</button>
      </div>
      <button id="dark-toggle" class="icon-btn" title="Modo oscuro">🌙</button>
      <button id="view-toggle" class="icon-btn" title="Vista lista / tablero">☰</button>
      <button id="trash-btn" class="icon-btn" title="Papelera">🗑️</button>
    </div>

    <!-- Barra de herramientas (minimal, estilo apps de notas) -->
    <div id="toolbar">
      <button id="new-note-btn" class="tool-btn new-note" title="Nueva nota">＋</button>
      <span class="tool-sep"></span>
      <button id="postit-btn" class="tool-btn active" title="Nota post-it">📝</button>
      <button id="pin-btn" class="tool-btn" title="Nota con chincheta">📌</button>
      <button id="group-btn" class="tool-btn" title="Grupo">▣</button>
      <button id="connect-btn" class="tool-btn" title="Unir notas">⤳</button>
      <span class="tool-sep"></span>
      <button id="zoom-out" class="tool-btn">－</button>
      <span id="zoom-label">100%</span>
      <button id="zoom-in" class="tool-btn">＋</button>
      <button id="reset-view" class="tool-btn" title="Centrar">⌂</button>
    </div>

    <div id="color-picker" class="color-picker hidden">
      <div class="swatch yellow active" data-color="yellow"></div>
      <div class="swatch pink" data-color="pink"></div>
      <div class="swatch green" data-color="green"></div>
      <div class="swatch blue" data-color="blue"></div>
      <div class="swatch purple" data-color="purple"></div>
      <div class="swatch white" data-color="white"></div>
    </div>

    <div id="connect-hint" class="connect-hint hidden">Clic en un ancla de la 1ª nota y luego de la 2ª · Esc cancela</div>
    <div id="tool-hint" class="tool-hint hidden">Clic en el lienzo para crear un grupo · Esc cancela</div>
  </main>

  <!-- ============ PANEL INSPECTOR ============ -->
  <aside id="inspector" class="hidden">
    <div class="inspector-head">
      <h3>Nota</h3>
      <button id="insp-close" class="icon-btn small">✕</button>
    </div>
    <label>Texto</label>
    <textarea id="insp-text" rows="5" placeholder="Escribe tu nota…"></textarea>
    <label>Etiquetas (separadas por comas)</label>
    <input id="insp-tags" type="text" placeholder="ideas, urgente…" />
    <label>Estilo</label>
    <div class="insp-styles">
      <button id="insp-style-postit" class="style-btn active">📝 Post-it</button>
      <button id="insp-style-pin" class="style-btn">📌 Chincheta</button>
    </div>
    <label>Color</label>
    <div class="insp-colors">
      <div class="swatch yellow active" data-color="yellow"></div>
      <div class="swatch pink" data-color="pink"></div>
      <div class="swatch green" data-color="green"></div>
      <div class="swatch blue" data-color="blue"></div>
      <div class="swatch purple" data-color="purple"></div>
      <div class="swatch white" data-color="white"></div>
    </div>
    <div class="insp-privacy">
      <button id="insp-private" class="privacy-note-btn">🔒 Marcar como privada</button>
    </div>
    <div class="insp-actions">
      <button id="insp-delete" class="danger-btn">🗑 Eliminar</button>
    </div>
  </aside>

  <!-- ============ BOOKMARKS VIEW (estilo Raindrop) ============ -->
  <main id="bookmarks-view" class="hidden">
    <div class="bm-topbar">
      <h2 id="bm-collection-title">Todos los bookmarks</h2>
      <div class="bm-search">
        <input id="bm-search-input" type="text" placeholder="Buscar…" />
      </div>
      <button id="bm-sort-btn" class="ghost-btn" title="Ordenar">⇅ Fecha</button>
      <button id="bm-export-btn" class="ghost-btn" title="Exportar a Markdown">⬇ .md</button>
      <button id="bm-add-btn" class="primary-btn">＋ Añadir link</button>
    </div>
    <div id="bm-grid" class="bm-grid"></div>
    <div id="bm-empty" class="bm-empty hidden">No hay bookmarks aquí. Añade el primero con "＋ Añadir link".</div>
  </main>

  <!-- Diálogo para pedir confirmación/nombre -->
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <input id="modal-input" type="text" placeholder="Nombre de la pizarra" />
      <div class="modal-actions">
        <button id="modal-cancel" class="ghost-btn">Cancelar</button>
        <button id="modal-ok" class="primary-btn">Aceptar</button>
      </div>
    </div>
  </div>

  <!-- Diálogo para añadir bookmark -->
  <div id="bm-modal" class="modal hidden">
    <div class="modal-card wide">
      <h3>Añadir link</h3>
      <label>URL</label>
      <input id="bm-url" type="url" placeholder="https://…" />
      <div class="bm-fetch-row">
        <button id="bm-fetch-btn" class="ghost-btn">✨ Descubrir metadatos</button>
        <span id="bm-fetch-status" class="bm-fetch-status"></span>
      </div>
      <label>Título</label>
      <input id="bm-title" type="text" placeholder="Título (se detecta automáticamente)" />
      <label>Descripción</label>
      <textarea id="bm-excerpt" rows="2" placeholder="Descripción"></textarea>
      <label>Nota</label>
      <textarea id="bm-note" rows="2" placeholder="Nota personal"></textarea>
      <label>Etiquetas (separadas por comas)</label>
      <input id="bm-tags" type="text" placeholder="tech, kpop, dev" />
      <label>Colección</label>
      <select id="bm-collection"></select>
      <div class="modal-actions">
        <button id="bm-cancel" class="ghost-btn">Cancelar</button>
        <button id="bm-save" class="primary-btn">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Papelera -->
  <div id="trash-modal" class="modal hidden">
    <div class="modal-card trash-card">
      <div class="inspector-head">
        <h3>🗑️ Papelera</h3>
        <button id="trash-close" class="icon-btn small">✕</button>
      </div>
      <div id="trash-notes" class="trash-section"></div>
      <div id="trash-bookmarks" class="trash-section"></div>
      <div id="trash-empty" class="bm-empty hidden">La papelera está vacía.</div>
    </div>
  </div>

  <script src="app.4.js"></script>
</body>
</html>
