<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd1d6"/>
      <stop offset="1" stop-color="#f9b8c2"/>
    </linearGradient>
  </defs>

  <!-- Fondo rosa pastel -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>

  <!-- Tablero blanco redondeado -->
  <rect x="132" y="132" width="248" height="248" rx="36" fill="#fff"
        style="filter: drop-shadow(0 12px 24px rgba(200,90,110,.28))"/>

  <!-- Check rosa (símbolo simple) -->
  <path d="M214 268 l36 36 l62-72" fill="none" stroke="#f06a86" stroke-width="30"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Chincheta rosa decorativa -->
  <circle cx="356" cy="168" r="14" fill="#f06a86"/>
</svg>
